[package]
name = "state-store"
description = "Recent entries kept in memory, bounded by count and by age: the newest, a list, a map by key, or a list for each key."
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
repository = "https://github.com/nodeve-com/state-store"
include = ["/src", "/README.md", "/LICENSE"]

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
struct_excessive_bools = "deny"
fn_params_excessive_bools = "deny"
too_many_lines = "warn"

[workspace]
resolver = "2"
